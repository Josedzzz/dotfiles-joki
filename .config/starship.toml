format = """
  $directory\
$git_branch\
$git_status\
$fill\
$line_break\
$character"""

add_newline = true
palette = 'ashes'

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
# Show the FULL path (set a high limit so it never truncates)
truncation_length = 999
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ' '

[palettes.ashes]
# colors from NvChad's base46 "ashes" theme, same as Neovim + Ghostty
dark_blue = '#8ca5be'
blue = '#95aec7'
teal = '#8fb4b5'
red = '#c79595'
orange = '#c7ae95'
green = '#aec795'
yellow = '#c7c795'
purple = '#ae95c7'
gray = '#44484b'
black = '#1c2023'
white = '#c7ccd1'
