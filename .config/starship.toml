# Powerline-style prompt in NvChad's "ashes" colors.
# Each part is a rounded "pill" with its own background
# (the path has a flat left edge):
# | ~/.config/nvim) ( main !?) ( v22.1)            ( 3s) ( 14:05)
# ❯
# The  /  characters are the rounded left/right edges (Nerd Font).

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$c\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true
palette = 'ashes'

[directory]
style = 'bg:blue fg:black'
read_only = " "
read_only_style = 'bg:blue fg:red'
format = "[  $path]($style)[$read_only]($read_only_style)[](fg:blue) "
# Show the FULL path (set a high limit so it never truncates)
truncation_length = 999
truncate_to_repo = false

[directory.substitutions]
'Documents' = "\U000F0219 "
'Downloads' = " "
'Music' = " "
'Pictures' = " "

# branch opens the green pill, git_status closes it
[git_branch]
style = 'bg:green fg:black'
symbol = " "
format = "[](fg:green)[$symbol$branch]($style)"

[git_status]
style = 'bg:green fg:black'
format = "[( $all_status$ahead_behind)]($style)[](fg:green) "
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '='
untracked = '?'
stashed = '$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'

# language versions only show up inside a project of that language
[nodejs]
symbol = " "
style = 'bg:purple fg:black'
format = "[](fg:purple)[$symbol$version]($style)[](fg:purple) "

[python]
symbol = " "
style = 'bg:yellow fg:black'
format = "[](fg:yellow)[$symbol$version( \\($virtualenv\\))]($style)[](fg:yellow) "

[golang]
symbol = " "
style = 'bg:teal fg:black'
format = "[](fg:teal)[$symbol$version]($style)[](fg:teal) "

[c]
symbol = " "
style = 'bg:purple fg:black'
format = "[](fg:purple)[$symbol$version]($style)[](fg:purple) "

[fill]
symbol = ' '

# how long the last command took (only if > 2s)
[cmd_duration]
min_time = 2000
style = 'bg:orange fg:black'
format = "[](fg:orange)[ $duration]($style)[](fg:orange) "

[time]
disabled = false
time_format = '%H:%M'
style = 'bg:surface fg:white'
format = "[](fg:surface)[ $time]($style)[](fg:surface)"

[character]
success_symbol = '[❯](bold fg:purple)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'

[palettes.ashes]
# colors from NvChad's base46 "ashes" theme, same as Neovim + Ghostty
dark_blue = '#8ca5be'
blue = '#95aec7'
teal = '#8fb4b5'
red = '#c79595'
orange = '#c7ae95'
green = '#aec795'
yellow = '#c7c795'
purple = '#ae95c7'
gray = '#565a5d'
surface = '#3a3e41'
black = '#1c2023'
white = '#c7ccd1'
